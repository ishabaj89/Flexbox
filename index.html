<!DOCTYPE html>
<html lang="en">
<head>

    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="style/style.css">

</head>

<body>

    <main class="squares">

        <!-- First block -->
        <div class="squares__block squares__block--first">

        <!-- Second block -->
        <div class="squares__block squares__block--second">
            <div class="squares__small"></div>
            <div class="squares__small"></div>

        </div>

        <!-- Third block -->
        <div class="squares__block squares__block--third">
            <div class="squares__small"></div>
            <div class="squares__small"></div>
            <div class="squares__small"></div>
        </div>

        <!-- Fourth block -->
        <div class="squares__block squares__block--fourth">
            <div class="squares__small"></div>
            <div class="squares__small"></div>
            <div class="squares__small"></div>
        </div>

        <!-- Fifth block -->
        <div class="squares__block squares__block--fifth">
            <div class="squares__small">
                <p>Some text</p>
            </div>

            <div class="squares__small">
                <p>Some text</p>
            </div>

            <div class="squares__small">
                <p>Some text</p>
            </div>
        </div>

        <!-- Sixth block -->
        <div class="squares__block squares__block--sixth">
            <div class="squares__small"></div>
            <div class="squares__long"></div>
            <div class="squares__small"></div>
        </div>

    </main>

</html>
